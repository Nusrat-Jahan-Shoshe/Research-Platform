name: Laravel

on:
  push:
    branches: [ "main", "DataBase" ]
  pull_request:
    branches: [ "main", "DataBase" ]
  workflow_dispatch:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, zip, bcmath, fileinfo, curl
          tools: composer:v2
          coverage: none

      - name: Prepare environment & directories
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          mkdir -p database storage/framework/{sessions,views,cache} bootstrap/cache
          touch database/database.sqlite
          chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate application key & migrate SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan key:generate --force
          php artisan migrate --force

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install npm dependencies & build Vite assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Verify PHP formatting (Pint)
        run: vendor/bin/pint --test

      - name: Execute PHPUnit test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --compact
