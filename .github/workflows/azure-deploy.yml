name: 🚀 Deploy Co-Auth to Azure App Service

on:
  push:
    branches: [ "main", "DataBase" ]
  workflow_dispatch:

concurrency:
  group: azure-app-service-deploy
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: >-
            mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite,
            sqlite3, zip, bcmath, fileinfo, curl, tokenizer
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install npm dependencies & build Vite assets
        run: |
          npm ci --ignore-scripts
          npm run build
        env:
          VITE_APP_NAME: "Co-Auth"
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.REVERB_HOST || (secrets.AZURE_APP_NAME && format('{0}.azurewebsites.net', secrets.AZURE_APP_NAME)) || 'localhost' }}
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: https

      - name: Run application test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          mkdir -p database storage/framework/{sessions,views,cache} bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan test --compact
          rm -f database/database.sqlite .env

  deploy-to-azure:
    name: Deploy to Azure App Service
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Check Azure deployment credentials
        id: check-azure
        env:
          AZURE_APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          REVERB_HOST: ${{ secrets.REVERB_HOST }}
        run: |
          if [ -n "$AZURE_APP_NAME" ] && [ -n "$AZURE_PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            TARGET_URL=$(printf '%s' "$AZURE_PUBLISH_PROFILE" | tr '\r\n' ' ' | sed -n 's/.*destinationAppUrl="\([^"]*\)".*/\1/p' | head -n 1)
            if [ -z "$TARGET_URL" ] && [ -n "$REVERB_HOST" ]; then
              TARGET_URL="https://${REVERB_HOST}"
            elif [ -z "$TARGET_URL" ]; then
              TARGET_URL="https://${AZURE_APP_NAME}.azurewebsites.net"
            fi
            echo "app_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "Azure deployment credentials detected for app: $AZURE_APP_NAME ($TARGET_URL)"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Azure deploy — AZURE_APP_NAME or AZURE_WEBAPP_PUBLISH_PROFILE secret is not configured in this repository."
          fi

      - name: Checkout repository
        if: steps.check-azure.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        if: steps.check-azure.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: >-
            mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite,
            sqlite3, zip, bcmath, fileinfo, curl, tokenizer
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        if: steps.check-azure.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install production Composer dependencies
        if: steps.check-azure.outputs.ready == 'true'
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Ensure storage & cache directories exist
        if: steps.check-azure.outputs.ready == 'true'
        run: |
          mkdir -p storage/framework/{sessions,views,cache} bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Setup Node.js 22
        if: steps.check-azure.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Build production frontend assets
        if: steps.check-azure.outputs.ready == 'true'
        run: |
          npm ci --ignore-scripts
          npm run build
        env:
          VITE_APP_NAME: ${{ secrets.APP_NAME || 'Co-Auth' }}
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.REVERB_HOST || format('{0}.azurewebsites.net', secrets.AZURE_APP_NAME) }}
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: https

      - name: Prepare production .env safely
        if: steps.check-azure.outputs.ready == 'true'
        env:
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_APP_NAME: ${{ secrets.APP_NAME }}
          SECRET_APP_URL: ${{ steps.check-azure.outputs.app_url }}
          SECRET_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECRET_REVERB_KEY: ${{ secrets.REVERB_APP_KEY }}
          SECRET_REVERB_HOST: ${{ secrets.REVERB_HOST }}
        run: |
          cp .env.example .env
          sed -i "s|APP_ENV=.*|APP_ENV=production|" .env
          sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|" .env
          if [ -n "$SECRET_APP_NAME" ]; then
            sed -i "s|APP_NAME=.*|APP_NAME=\"${SECRET_APP_NAME}\"|" .env
          else
            sed -i "s|APP_NAME=.*|APP_NAME=\"Co-Auth\"|" .env
          fi
          if [ -n "$SECRET_APP_URL" ]; then
            sed -i "s|APP_URL=.*|APP_URL=${SECRET_APP_URL}|" .env
          fi
          if [ -n "$SECRET_APP_KEY" ]; then
            sed -i "s|APP_KEY=.*|APP_KEY=${SECRET_APP_KEY}|" .env
          else
            php artisan key:generate --force
          fi
          if [ -n "$SECRET_OPENROUTER_KEY" ]; then
            sed -i "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${SECRET_OPENROUTER_KEY}|" .env
            sed -i "s|AI_API_KEY=.*|AI_API_KEY=${SECRET_OPENROUTER_KEY}|" .env
          fi
          sed -i "s|AI_BASE_URL=.*|AI_BASE_URL=https://openrouter.ai/api/v1|" .env
          sed -i "s|AI_MODEL=.*|AI_MODEL=openai/gpt-4o-mini|" .env
          sed -i "s|OPENROUTER_BASE_URL=.*|OPENROUTER_BASE_URL=https://openrouter.ai/api/v1|" .env
          sed -i "s|OPENROUTER_MODEL=.*|OPENROUTER_MODEL=openai/gpt-4o-mini|" .env
          sed -i "s|AI_FREE_FOR_ALL=.*|AI_FREE_FOR_ALL=true|" .env
          if [ -n "$SECRET_REVERB_KEY" ]; then
            sed -i "s|REVERB_APP_KEY=.*|REVERB_APP_KEY=${SECRET_REVERB_KEY}|" .env
          fi
          if [ -n "$SECRET_REVERB_HOST" ]; then
            sed -i "s|REVERB_HOST=.*|REVERB_HOST=\"${SECRET_REVERB_HOST}\"|" .env
            sed -i "s|REVERB_PORT=.*|REVERB_PORT=443|" .env
            sed -i "s|REVERB_SCHEME=.*|REVERB_SCHEME=https|" .env
          fi

      - name: Strip development artifacts
        if: steps.check-azure.outputs.ready == 'true'
        run: |
          rm -rf \
            node_modules \
            tests \
            .github \
            docs \
            .cursor \
            .claude \
            *.md \
            *.docx \
            CLAUDE.md \
            AGENTS.md \
            phpunit.xml \
            .phpunit.result.cache \
            .editorconfig \
            .npmrc \
            database/database.sqlite

      - name: Deploy package to Azure App Service
        if: steps.check-azure.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Verify live Azure endpoint
        if: steps.check-azure.outputs.ready == 'true'
        env:
          TARGET_URL: ${{ steps.check-azure.outputs.app_url }}
        run: |
          URL="$TARGET_URL"
          echo "Checking $URL ..."
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Site returned HTTP $CODE after deployment warmup window."
