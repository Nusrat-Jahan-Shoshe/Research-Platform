contracts:
  - name: project-json-api
    unit: project-api
    type: rest
    stability: frozen
    source_loc: routes/api.php:21
    contract:
      method: "GET /api/v1/projects/{project}"
      path: /api/v1/projects/{project}
      request: authenticated project member
      response: data object containing project, members, versions, tasks, feedback, papers, citations, media
      error: 401 unauthenticated; 403 non-member; 404 missing project
      auth: Laravel session auth plus project.member middleware
    target_contract: {method: "GET /api/v1/projects/{project}", notes: preserve JSON envelope and membership guard}
    semantic_divergence: []
  - name: ai-summary
    unit: ai-api
    type: rest
    stability: must_preserve
    source_loc: routes/api.php:44
    contract:
      method: "POST /api/v1/projects/{project}/ai/summary"
      path: /api/v1/projects/{project}/ai/summary
      request: "instruction, model, temperature, depth, checklist"
      response: "data.model, provider, temperature, content"
      error: 401/403 access; 422 validation; 503 AI unavailable
      auth: Laravel session auth, project membership, ai.access
