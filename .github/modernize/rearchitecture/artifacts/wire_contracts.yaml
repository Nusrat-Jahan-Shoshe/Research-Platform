      request: "download/format query or bibtex text/file"
      response: "JSON count/data or downloadable BibTeX/RIS"
      error: 422 invalid input; 403 non-member; 404 missing citation/project
      auth: Laravel session auth and project membership
    target_contract: {method: "preserve BibTeX/RIS import/export", notes: preserve citation keys and in-text tags}
    semantic_divergence: []
  - name: manuscript-downloads
